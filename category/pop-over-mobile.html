    <!-- FIX: Flush bottom para intercepto mobile de Qualtrics -->
    <!-- FIX: Flush bottom para intercepto mobile de Qualtrics -->
<script>
(function() {
    var ZONE_ID = 'ZN_3O7CdaWvuM7LOjY';

    function flushBottom() {
        var selectors = [
            '#QSI_S_' + ZONE_ID,
            '[id^="QSI_S_' + ZONE_ID + '"]',
            '#QSIWindow',
            'div[id^="QSI_S_ZN_"]'
        ];

        for (var i = 0; i < selectors.length; i++) {
            var el = document.querySelector(selectors[i]);
            if (el) {
                el.style.setProperty('position', 'fixed', 'important');
                el.style.setProperty('bottom', '0', 'important');
                el.style.setProperty('top', 'auto', 'important');
                el.style.setProperty('left', '0', 'important');
                el.style.setProperty('right', '0', 'important');
                el.style.setProperty('margin', '0', 'important');
                el.style.setProperty('width', '100%', 'important');
                el.style.setProperty('max-width', '100vw', 'important');

                var modal = el.firstElementChild;
                if (modal) {
                    modal.style.setProperty('position', 'fixed', 'important');
                    modal.style.setProperty('bottom', '0', 'important');
                    modal.style.setProperty('top', 'auto', 'important');
                    modal.style.setProperty('left', '0', 'important');
                    modal.style.setProperty('right', '0', 'important');
                    modal.style.setProperty('width', '100%', 'important');
                    modal.style.setProperty('border-radius', '16px 16px 0 0', 'important');
                    modal.style.setProperty('margin', '0', 'important');
                }
                return el;
            }
        }
        return null;
    }

    // Inyectar CSS global también (doble protección)
    var style = document.createElement('style');
    style.innerHTML = [
        '#QSI_S_' + ZONE_ID + ',',
        'div[id^="QSI_S_ZN_"],',
        '#QSIWindow {',
        '  position: fixed !important;',
        '  bottom: 0 !important;',
        '  top: auto !important;',
        '  left: 0 !important;',
        '  right: 0 !important;',
        '  margin: 0 !important;',
        '  width: 100% !important;',
        '  transform: none !important;',
        '}'
    ].join('\n');
    document.head.appendChild(style);

    // Polling continuo mientras el modal esté visible
    var interval = setInterval(flushBottom, 50);

    // Detener después de 10 segundos para no consumir recursos
    setTimeout(function() { clearInterval(interval); }, 10000);

    // MutationObserver como respaldo
    var observer = new MutationObserver(flushBottom);
    observer.observe(document.body, { 
        childList: true, 
        subtree: true, 
        attributes: true,
        attributeFilter: ['style']
    });

    window.addEventListener('message', function(e) {
        if (e.data && e.data.type === 'QSI_FLUSH_BOTTOM') {
            flushBottom();
        }
    });
})();
</script>
