    <!-- FIX: Flush bottom para intercepto mobile de Qualtrics -->
    <script>
    (function() {
        var ZONE_ID = 'ZN_3O7CdaWvuM7LOjY';

        function flushBottom() {
            // Selectores que Qualtrics puede usar para el contenedor
            var selectors = [
                '#QSI_S_' + ZONE_ID,
                '[id^="QSI_S_' + ZONE_ID + '"]',
                '#QSIWindow',
                'div[id^="QSI_S_ZN_"]'
            ];

            for (var i = 0; i < selectors.length; i++) {
                var el = document.querySelector(selectors[i]);
                if (el) {
                    el.style.setProperty('position', 'fixed', 'important');
                    el.style.setProperty('bottom', '0', 'important');
                    el.style.setProperty('top', 'auto', 'important');
                    el.style.setProperty('left', '0', 'important');
                    el.style.setProperty('right', '0', 'important');
                    el.style.setProperty('margin', '0', 'important');
                    el.style.setProperty('width', '100%', 'important');

                    // Esquinas superiores redondeadas, inferiores al ras
                    var modal = el.firstElementChild;
                    if (modal) {
                        modal.style.setProperty('border-radius', '16px 16px 0 0', 'important');
                        modal.style.setProperty('bottom', '0', 'important');
                        modal.style.setProperty('top', 'auto', 'important');
                    }
                    return true;
                }
            }
            return false;
        }

        // Intentar inmediatamente y con reintentos
        var attempts = 0;
        var interval = setInterval(function() {
            if (flushBottom() || ++attempts > 50) {
                clearInterval(interval);
            }
        }, 100);

        // También escuchar postMessage desde el iframe de la encuesta
        window.addEventListener('message', function(e) {
            if (e.data && e.data.type === 'QSI_FLUSH_BOTTOM') {
                flushBottom();
            }
        });

        // Observar el DOM para cuando Qualtrics inyecte el contenedor
        var observer = new MutationObserver(function() {
            if (flushBottom()) {
                observer.disconnect();
            }
        });
        observer.observe(document.body, { childList: true, subtree: true });
    })();
    </script>
