           FLUSH BOTTOM FIX — MOBILE INTERCEPT

        /* Eliminar márgenes del body y html dentro del iframe */
        html, body {
          margin: 0 !important;

        /* El SkinContent es el wrapper principal — sin márgenes inferiores */
        #SkinContent {
          padding-bottom: env(safe-area-inset-bottom, 0px) !important;
          margin-bottom: 0 !important;
        }
        
        /* Quitar el PushStickyFooter que Qualtrics usa para empujar el footer */
        #PushStickyFooter {
          display: none !important;
          height: 0 !important;
          min-height: 0 !important;
        }

          padding-bottom: env(safe-area-inset-bottom, 0px) !important;
          margin-bottom: 0 !important;
        }
        
        /* El área de botones no debe tener padding inferior extra en mobile */
        @media (max-width: 480px) {
          #Buttons {
            padding-bottom: calc(8px + env(safe-area-inset-bottom, 0px)) !important;
            margin-bottom: 0 !important;
          }
        
          /* El skin completo sin margen inferior */
          .Skin {
            margin-bottom: 0 !important;
            padding-bottom: 0 !important;
          }
